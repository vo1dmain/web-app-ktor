ktor {
  deployment {
    host = "localhost"
    port = 8080
  }

  application {
    modules = [ ru.vo1d.web.app.ModuleKt.mainModule ]
  }
}

daybook {
  # IANA zone of the schedule: session start times and week parity are local to it
  timeZone = "Europe/Moscow"
}

database {
  # one JDBC driver for all three databases; its artifact must be on the app runtime classpath
  driver = "org.h2.Driver"
  # files relative to the working directory: app/build/ under :app:run;
  # the schema is not migrated, delete the files after changing tables
  news = "jdbc:h2:file:./build/news"
  qna = "jdbc:h2:file:./build/qna"
  daybook = "jdbc:h2:file:./build/daybook;MODE=MYSQL"

  # demo news (into empty tables) and demo groups; the daybook reference data is always loaded
  demoData = true
}
