ktor {
  deployment {
    host = "localhost"
    port = 8080
  }

  application {
    modules = [
      ru.vo1d.web.api.plugins.ContentNegotiationKt.contentNegotiation
      ru.vo1d.web.api.plugins.ResourcesKt.resources
      ru.vo1d.web.api.plugins.LoggingKt.logging
      ru.vo1d.web.api.plugins.HTTPKt.http
      ru.vo1d.web.api.plugins.StatusPagesKt.statusPages
      # last: installs DI and the routes, which need the plugins above
      ru.vo1d.web.app.ModuleKt.mainModule
    ]
  }
}

daybook {
  # IANA zone of the schedule: session start times and week parity are local to it
  timeZone = "Europe/Moscow"
}

database {
  # one JDBC driver for all three databases; its artifact must be on the app runtime classpath
  driver = "org.h2.Driver"
  news = "jdbc:h2:mem:newsDb;DB_CLOSE_DELAY=-1;"
  qna = "jdbc:h2:mem:qnaDb;DB_CLOSE_DELAY=-1;"
  # relative to the working directory: app/build/ under :app:run
  daybook = "jdbc:h2:file:./build/daybook;MODE=MYSQL"
}
